
name: Build Gül Şekerleme APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q Gul_Sekerleme_APK_Hazirlama_Paketi.zip -d extracted
          SETTINGS_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: ZIP içinde settings.gradle bulunamadı."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          APK_PATH=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi
          cp "$APK_PATH" Gul-Sekerleme-APK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gul-Sekerleme-APK
          path: Gul-Sekerleme-APK.apk
